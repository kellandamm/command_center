x-hard: &hard
  read_only: true
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=16m
  pids_limit: 128
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  worker:
    <<: *hard
    build: ./worker
    env_file: ./env/worker.env
    environment:
      HTTPS_PROXY: http://egress:3128
      HA_URL: http://ha-proxy:8080
      CONTAINER_STATUS_FILE: /var/lib/agent/containers.json
    volumes:
      - /srv/homelab-agent/status/containers.json:/var/lib/agent/containers.json:ro
    networks: [agent_int]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  ha-proxy:
    <<: *hard
    build: ./ha-proxy
    env_file: ./env/ha-proxy.env
    networks: [agent_int, egress_net]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  egress:
    <<: *hard
    image: ubuntu/squid:latest@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    volumes:
      - ./egress/squid.conf:/etc/squid/squid.conf:ro
    networks: [agent_int, egress_net]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

networks:
  agent_int:
    internal: true
  egress_net: {}
