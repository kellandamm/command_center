x-hard: &hard
  read_only: true
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=16m
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  worker:
    <<: *hard
    image: ${WORKER_IMAGE:?Set WORKER_IMAGE to ghcr.io/kellandamm/homelab-agent-worker@sha256:...}
    env_file: ./env/worker.env
    environment:
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      NO_PROXY: ha-proxy,localhost,127.0.0.1
      HA_URL: http://ha-proxy:8080
      CONTAINER_STATUS_FILE: /var/lib/agent/containers.json
    volumes:
      - /srv/homelab-agent/status/containers.json:/var/lib/agent/containers.json:ro
    networks: [agent_int]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 128

  ha-proxy:
    <<: *hard
    image: ${HA_PROXY_IMAGE:?Set HA_PROXY_IMAGE to ghcr.io/kellandamm/homelab-agent-ha-proxy@sha256:...}
    env_file: ./env/ha-proxy.env
    networks: [agent_int, egress_net]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
          pids: 128

  egress:
    <<: *hard
    image: ${EGRESS_IMAGE:?Set EGRESS_IMAGE to ghcr.io/kellandamm/homelab-agent-egress@sha256:...}
    tmpfs:
      - /tmp:size=16m,uid=10001,gid=10001,mode=1777
      - /run:size=8m,uid=10001,gid=10001,mode=0755
      - /var/spool/squid:size=32m,uid=10001,gid=10001,mode=0755
      - /var/log/squid:size=16m,uid=10001,gid=10001,mode=0755
    volumes:
      - ./egress/squid.conf:/etc/squid/squid.conf:ro
    networks: [agent_int, egress_net]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 128

networks:
  agent_int:
    internal: true
  egress_net: {}
