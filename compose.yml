# Command center dashboard. Copy .env.example to .env, fill it in, then: docker compose up -d
services:
  homepage:
    image: ${IMAGE:-ghcr.io/OWNER/command-center:latest}
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-UTC}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_USERNAME: ${GITHUB_USERNAME:-kellandamm}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      OWNER_EMAILS: ${OWNER_EMAILS:-}
      CONNECTIONS_MASTER_KEY: ${CONNECTIONS_MASTER_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      RECALLIO_URL: ${RECALLIO_URL:-}
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID:-}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET:-}
      WEATHER_LAT: ${WEATHER_LAT:-}
      WEATHER_LON: ${WEATHER_LON:-}
      ICS_URLS: ${ICS_URLS:-}
      BOOKMARKS_IMPORT_SECRET: ${BOOKMARKS_IMPORT_SECRET:-}
      BOOKMARKS_IMPORT_ALLOWED_CLIENT_IDS: ${BOOKMARKS_IMPORT_ALLOWED_CLIENT_IDS:-}
    ports:
      # Loopback only: put a tunnel or reverse proxy in front. Never publish this port to the internet unauthenticated.
      - "127.0.0.1:${HOST_PORT:-8088}:8080"
    volumes:
      - homepage-data:/data
    mem_limit: 512m
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  homepage-data:
